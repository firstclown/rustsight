[package]
name = "rustsight-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LLM, embedding, and rerank providers for rustsight (OpenAI-compatible HTTP + mocks)"

[features]
# Local ONNX cross-encoder reranker (RS-4): pulls in the `ort` ONNX runtime
# (~50-100 MB of prebuilt binaries) and the HuggingFace `tokenizers` crate.
# Opt-in so default builds stay light; the release binary is built with
# `cargo build --release -p rustsight-cli --features onnx-rerank`.
onnx-rerank = ["dep:ort", "dep:tokenizers", "dep:sha2"]
# CUDA build of the above: ONNX Runtime with CUDA execution-provider
# kernels (needs NVIDIA driver + CUDA 13 runtime + cuDNN 9 at run time;
# falls back to CPU automatically unless RUSTSIGHT_RERANK_DEVICE=cuda).
onnx-rerank-cuda = ["onnx-rerank", "ort/cuda", "dep:libloading"]

[dependencies]
rustsight-core = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `tokio::task::spawn_blocking` for the ONNX reranker's blocking inference
tokio = { workspace = true }
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }

[[example]]
name = "rerank_latency"
required-features = ["onnx-rerank"]
