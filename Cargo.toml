[workspace]
resolver = "2"
members = [
    "crates/rustsight-core",
    "crates/rustsight-storage",
    "crates/rustsight-providers",
    "crates/rustsight-server",
    "crates/rustsight-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rustsight-core = { path = "crates/rustsight-core" }
rustsight-storage = { path = "crates/rustsight-storage" }
rustsight-providers = { path = "crates/rustsight-providers" }
rustsight-server = { path = "crates/rustsight-server" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
clap = { version = "4", features = ["derive"] }
# Optional deps for the `onnx-rerank` feature (RS-4). Heavy: only pulled in
# when that feature is enabled somewhere in the workspace.
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "copy-dylibs",
    "tls-rustls",
] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
# dlopen probe for the CUDA runtime stack (onnx-rerank-cuda only)
libloading = "0.8"
# sha256 verification of downloaded reranker models (onnx-rerank only)
sha2 = "0.10"
# Snapshot tests for the upstream prompt parity suite (RS-5)
insta = { version = "1", features = ["filters"] }

[profile.release]
lto = "thin"
